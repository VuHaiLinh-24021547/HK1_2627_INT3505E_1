services:
  web:
    build: .
    container_name: flask_product_service
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:////app/instance/app.db
    volumes:
      # Mount volume để giữ lại dữ liệu SQLite khi restart container
      - sqlite_data:/app/instance
    restart: always

volumes:
  sqlite_data: